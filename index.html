<html lang="id">
<head>
<meta charset="utf-8">

<title>English Tug of War</title>
<style>
:root{--bg:#eef1f6;--card:#fff;--tx:#111;--mut:#64748b;--b:#2196f3;--bl:#e3f2fd;--bb:#90caf9;--r:#e53935;--rl:#fdeaea;--rb:#f5a3a3;--ln:#cbd5e1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f172a;--card:#1e293b;--tx:#f1f5f9;--mut:#94a3b8;--bl:#12304d;--bb:#2b6cb0;--rl:#4a1d1d;--rb:#9b3b3b;--ln:#475569;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f172a;--card:#1e293b;--tx:#f1f5f9;--mut:#94a3b8;--bl:#12304d;--bb:#2b6cb0;--rl:#4a1d1d;--rb:#9b3b3b;--ln:#475569;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;min-height:100vh}
button{font:inherit;cursor:pointer;color:inherit}
.hide{display:none!important}
#setup{max-width:760px;margin:0 auto;padding:24px 16px}
.card{background:var(--card);border-radius:18px;padding:22px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
h1{margin:0 0 4px;font-size:30px;text-align:center}
.sub{text-align:center;color:var(--mut);margin:0 0 20px}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
label{display:block;font-weight:700;font-size:14px;margin-bottom:6px}
input,select{width:100%;padding:11px 12px;border-radius:10px;border:2px solid var(--ln);background:var(--card);color:var(--tx);font:inherit}
#nb{border-color:var(--b)}#nr{border-color:var(--r)}
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin:8px 0 18px}
.tp{padding:12px 8px;border-radius:12px;border:2px solid var(--ln);background:var(--card);font-weight:600}
.tp.on{border-color:var(--b);background:var(--bl)}
.go{display:block;width:100%;margin-top:18px;padding:15px;border:0;border-radius:12px;background:#4f46e5;color:#fff;font-size:18px;font-weight:700}
.note{font-size:13px;color:var(--mut);margin-top:14px;text-align:center}
#game{padding:12px 16px 24px;max-width:1400px;margin:0 auto}
.head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0 14px;font-weight:800;font-size:22px}
.head .tb{color:var(--b)}.head .tr{color:var(--r)}
.head span.s{font-size:26px;margin:0 10px}
.logo{font-size:30px;font-weight:900;letter-spacing:-1px;text-align:center}
.grid{display:grid;grid-template-columns:minmax(230px,1fr) minmax(0,2fr) minmax(230px,1fr);gap:18px;align-items:start}
.pn{background:var(--card);border-radius:18px;padding:12px;border:2px solid}
.pn.b{border-color:var(--bb)}.pn.r{border-color:var(--rb)}
.qb{border-radius:14px;padding:22px 10px;text-align:center;font-size:30px;font-weight:800;line-height:1.2;margin-bottom:10px;border:1px solid;min-height:140px;display:flex;align-items:center;justify-content:center}
.b .qb{background:var(--bl);color:var(--b);border-color:var(--bb)}
.r .qb{background:var(--rl);color:var(--r);border-color:var(--rb)}
.op{display:flex;align-items:center;gap:10px;width:100%;margin-top:8px;padding:11px 12px;border-radius:12px;border:1.5px solid var(--ln);background:var(--card);font-weight:700;font-size:17px;text-align:center}
.op i{font-style:normal;flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;background:var(--bl);color:var(--b)}
.r .op i{background:var(--rl);color:var(--r)}
.op span{flex:1}
.op:disabled{cursor:default}
.op.ok{background:#22c55e;border-color:#16a34a;color:#fff}
.op.bad{background:#ef4444;border-color:#dc2626;color:#fff}
.stage{background:var(--card);border-radius:18px;position:relative;padding:44px 8px 8px}
.timer{position:absolute;top:-6px;left:50%;transform:translateX(-50%);background:var(--card);border-radius:30px;padding:8px 18px;font-weight:800;font-size:20px;color:#0288d1;box-shadow:0 2px 8px rgba(0,0,0,.15)}
svg{width:100%;height:auto;display:block}
#grp{transition:transform .45s ease}
.bar{display:flex;gap:10px;margin-top:14px}
.ib{padding:10px 14px;border-radius:12px;border:0;background:var(--card);font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.keys{margin-left:auto;font-size:13px;color:var(--mut);align-self:center}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:16px;z-index:9}
#ov .card{text-align:center;max-width:420px;width:100%}
#ov h2{font-size:34px;margin:6px 0}
@media (max-width:860px){.grid{grid-template-columns:1fr 1fr}.stage{grid-column:1/3;order:-1}.qb{font-size:22px;min-height:100px}.head{font-size:16px}.logo{font-size:20px}.teams{grid-template-columns:1fr}}
@media (max-width:520px){.grid{grid-template-columns:1fr}.stage{grid-column:auto}}
</style>
</head>

 $("#tnb").textContent=names.b;$("#tnr").textContent=names.r;
 $("#tnb").style.textTransform=$("#tnr").style.textTransform="uppercase";
 pos=0;sc={b:0,r:0};time=+$("#dur").value;deck={};run=true;
 $("#setup").classList.add("hide");$("#game").classList.remove("hide");$("#ov").classList.add("hide");
 nextQ("b");nextQ("r");upd();
 clearInterval(tid);tid=setInterval(()=>{time--;upd();if(time<=0)end(pos>0?"b":pos<0?"r":null)},1000);
}
function end(w){
 run=false;clearInterval(tid);
 setTimeout(()=>{
  $("#ovt").textContent=w?names[w]+" wins!":"Its's a tie!";
  $("#ovt").style.color=w=="b"?"var(--b)":w=="r"?"var(--r)":"inherit";
  $("#ovs").textContent=`${names.b} ${sc.b} points · ${names.r} ${sc.r} points`;
  $("#ov").classList.remove("hide");
 },700);
}
function menu(){run=false;clearInterval(tid);$("#game").classList.add("hide");$("#ov").classList.add("hide");$("#setup").classList.remove("hide")}
$("#start").onclick=start;$("#again").onclick=start;$("#menu").onclick=menu;$("#home").onclick=menu;
$("#pb").onclick=e=>{const b=e.target.closest(".op");b&&answer("b",+b.dataset.i)};
$("#pr").onclick=e=>{const b=e.target.closest(".op");b&&answer("r",+b.dataset.i)};
const K={q:["b",0],w:["b",1],e:["b",2],r:["b",3],u:["r",0],i:["r",1],o:["r",2],p:["r",3]};
document.addEventListener("keydown",e=>{if(!run||e.target.tagName=="INPUT"||e.ctrlKey||e.metaKey)return;const k=K[e.key.toLowerCase()];k&&answer(k[0],k[1])});
</script>
</body>
</html>
